[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "segmentiq-analysis"
version = "0.1.0"
description = "Independent purchase-only RFM customer segmentation engine"
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.26,<3",
    "pandas>=2.2,<4",
    "scikit-learn>=1.5,<2",
    "openpyxl>=3.1,<4",
    "defusedxml==0.7.1",
]

[project.optional-dependencies]
backend = [
    "fastapi>=0.115.12,<1",
    "starlette>=0.46,<2",
    "pydantic>=2.8,<3",
    "uvicorn>=0.30,<1",
    "python-multipart>=0.0.20,<1",
]
test = ["pytest>=8,<10", "httpx>=0.27,<1"]

[tool.setuptools.packages.find]
include = ["segmentation*", "backend*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
markers = ["integration: optional original-workbook validation"]
